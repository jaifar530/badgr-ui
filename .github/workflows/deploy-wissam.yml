name: Build + deploy dashboard.wissam.om

on:
  push:
    branches: [wissam]
  workflow_dispatch:

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Fail before building rather than shipping a broken locale or a stale mirror.
      - name: i18n + RTL source gates
        run: |
          npm run verify:i18n
          npm run verify:rtl-css
          # No NEW physical direction utilities - they do not mirror under dir=rtl.
          # Logical forms: ms/me, ps/pe, start/end, text-start/text-end, gap.
          BAD=$(git diff --unified=0 origin/wissam...HEAD -- "*.html" "*.ts" 2>/dev/null | grep "^+" | grep -v "^+++" | grep -E "tw-(ml|mr|pl|pr|left|right)-|tw-text-(left|right)|tw-space-x-" | grep -vc "physical-ok" || true)
          echo "new physical utilities: $BAD"
          [ "$BAD" -eq 0 ]

      - run: npm run build:app
      - run: npm run build:web-components:prod

      # A failed build must NEVER ship a stale bundle (learned 19 Aug 2026:
      # a swallowed build error once deployed yesterday's dist).
      - name: Pre-deploy gates
        run: |
          P=$(grep -rl "652673" dist/ --include="*.js" | wc -l)
          D=$(grep -ro "changeLng(.de.)" dist/ --include="*.js" | wc -l)
          U=$(grep -c umami dist/index.html || true)
          T=$(find dist -name "tajawal*" | wc -l)
          A=$(grep -c '"ar"' dist/assets/i18n/ar.json || true)
          # <html> must carry dir; html-minifier strips the quotes.
          H=$(grep -cE "<html[^>]*dir=" dist/index.html || true)
          # The pre-Angular direction script must survive minification.
          S=$(grep -c documentElement dist/index.html || true)
          # The mirrored legacy stylesheet must reach the bundle.
          # The CSS minifier strips the attribute quotes: dir="rtl" ships as dir=rtl.
          R=$(cat dist/styles-*.css | grep -o "dir=["']\?rtl" | wc -l)
          echo "palette=$P DE=$D umami=$U tajawal=$T ar=$A html-dir=$H dir-script=$S rtl-css=$R"
          [ "$P" -gt 0 ] && [ "$D" -eq 0 ] && [ "$U" -eq 0 ] && [ "$T" -gt 0 ] && [ "$A" -gt 0 ] && [ "$H" -gt 0 ] && [ "$S" -gt 0 ] && [ "$R" -gt 0 ]


      - name: Brand the page title
        run: sed -i 's|<title>Open Educational Badges</title>|<title>Wissam — وسام</title>|' dist/index.html

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host key PINNED (no runtime keyscan: the server's OpenSSH per-source
          # penalties drop unauthenticated scans from CI ranges, and ssh-keyscan
          # exits 0 even when it collects nothing).
          echo "212.24.97.111 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFf0leElkDkjH6zGU2f3yrj08B75oOBd37ztgMeqDJNG" >> ~/.ssh/known_hosts

      - name: Ship dist (previous kept as dist.old for rollback)
        run: |
          tar -czf dist.tgz dist
          scp -i ~/.ssh/deploy_key dist.tgz wissam@212.24.97.111:/tmp/
          ssh -i ~/.ssh/deploy_key wissam@212.24.97.111 '
            set -e
            rm -rf /home/wissam/badgr-ui/dist.old
            mv /home/wissam/badgr-ui/dist /home/wissam/badgr-ui/dist.old
            tar -xzf /tmp/dist.tgz -C /home/wissam/badgr-ui/
            rm -f /tmp/dist.tgz'

      - name: Verify live
        run: |
          sleep 5
          curl -s --max-time 30 https://dashboard.wissam.om/ | grep -q "Wissam" && echo "dashboard OK"
