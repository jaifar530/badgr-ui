<!doctype html>

	<head>
		<script>
			/* Wissam: set lang+dir before first paint. Angular re-applies the same values
			   in LanguageService; this exists so there is no flash of LTR chrome and so
			   CDK Directionality (which reads documentElement.dir once, lazily) is right. */
			(function () {
				var DIR = { ar: "rtl", en: "ltr", de: "ltr" };
				var l = null;
				try {
					var m = /[?&]lang=([a-zA-Z-]+)/.exec(location.search);
					if (m) { l = m[1].toLowerCase(); localStorage.setItem("lang", l); }
					else { l = (localStorage.getItem("lang") || "").toLowerCase(); }
				} catch (e) { /* storage blocked: fall through to the default */ }
				if (!DIR[l]) l = "en"; /* WISSAM-DEFAULT-LANG */
				document.documentElement.lang = l;
				document.documentElement.dir = DIR[l];
			})();
		</script>
